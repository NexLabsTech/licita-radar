<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · LicitaRadar</title><link rel="stylesheet" href="/static/site.css"></head>
<body class="login-body">
<main class="login-card">
  <div class="logo"><span class="logo-dot">◉</span> LicitaRadar</div>
  <p class="muted">Seu painel particular de inteligência em licitações.</p>
  <h1>Acesso restrito</h1>
  {% if error %}<p class="error" role="alert">Usuário ou senha incorretos.</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Usuário</label>
    <input id="username" name="username" autocomplete="username" required maxlength="100" autofocus>
    <label for="password">Senha</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Entrar no painel →</button>
  </form>
  <p class="hint">Sem cadastro público. Credenciais configuradas somente no servidor.</p>
</main>
</body></html>
