name: CI LicitaRadar
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    name: Python ${{ matrix.python-version }} / lint + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax
        run: python -m compileall -q app tests
      - name: Lint
        run: ruff check app tests
      - name: JavaScript syntax
        run: node --check app/static/site.js
      - name: Unit and integration tests (mocked external API)
        run: python -m pytest -q
      - name: PNCP live smoke (advisory; upstream availability may vary)
        continue-on-error: true
        run: python -m scripts.live_smoke

  visual-smoke:
    name: Visual smoke / Chromium desktop + mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install app and browser automation
        run: python -m pip install -r requirements-dev.txt 'playwright>=1.55,<2'
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Browser login/dashboard checks
        run: python -m scripts.visual_smoke
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: licitaradar-ux-screenshots
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
